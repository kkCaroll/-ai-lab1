# M3 P-Tuning v2。在每一层前置可训练的虚拟键值对，不改动基座权重。
#
# 实际使用的 peft 类为 PrefixTuningConfig。peft 中名为 P-Tuning 的 PromptEncoderConfig
# 实测只把软提示拼在输入嵌入之前，属 P-Tuning 而非 v2，理由见 src/methods/ptuning.py。

method: ptuning

train:
  lr: 3.0e-4
  epochs: 3
  batch_size: 4           # 本方法不能开梯度检查点，激活值随微批线性涨，故取共用值的一半
  grad_accum: 16          # 有效批仍为 64
  gradient_checkpointing: false   # 开则框架把 past_key_values 置空，前缀进不了注意力，见 LOG/02 的 Q14

ptuning:
  num_virtual_tokens: 20          # 虚拟 token 数，改其值即改可训练参数量，故不随 P2.5 扫，见 PLAN/01 的 P2.5 设计
  prefix_projection: false        # 假则各层前缀直接优化，真则另经一个小规模多层感知机生成
  encoder_hidden_size: 512        # 仅 prefix_projection 为真时生效
  init_weights: zero              # zero 或 null，P2.5 扫描；两者都不使前缀成为恒等映射，见 LOG/02 的 Q15
